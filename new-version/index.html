<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - Pro Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body class="bg-dark text-white">

    <div class="container text-center py-5">
        <h1 class="mb-4">Simon Says</h1>
        
        <div id="game-area">
            <h2 id="countdown" class="display-1 fw-bold text-warning">5</h2>
            <div id="numbers-list" class="d-flex justify-content-center gap-3 my-4">
                </div>
        </div>

        <form id="answers-form" class="d-none mx-auto" style="max-width: 400px;">
            <p class="lead">Inserisci i numeri che ricordi:</p>
            <div id="inputs-container"></div>
            <button type="submit" class="btn btn-warning w-100 mt-3">Verifica</button>
        </form>

        <div id="result" class="mt-4"></div>
    </div>

    <script src="./scripts/script.js"></script>
</body>
</html>
